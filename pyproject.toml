[project]
name = "pecan-vision-kit"
version = "0.1.1"
description = "Web recorder and vision tools for Raspberry Pi 5 workshop kits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "rfdetr>=1.11.2",
    "torch==2.14.1+cpu",
    "torchvision==0.29.1+cpu",
    "ultralytics>=8.4.23,<8.5",
]

[tool.uv]
package = false
# This Pi has no NVIDIA GPU. The default PyTorch wheel on PyPI depends on
# CUDA, cuDNN, and the rest of that stack. Torch and torchvision come from
# the CPU index below. The other names are pulled in for training plots,
# dataset tables, or GPU stats, and this app does not call those paths.
exclude-dependencies = [
    "cuda-bindings",
    "cuda-toolkit",
    "matplotlib",
    "nvidia-cublas-cu12",
    "nvidia-cuda-cupti-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cudnn-cu13",
    "nvidia-cufft-cu12",
    "nvidia-cufile-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-cusparselt-cu12",
    "nvidia-cusparselt-cu13",
    "nvidia-ml-py",
    "nvidia-nccl-cu12",
    "nvidia-nccl-cu13",
    "nvidia-nvjitlink-cu12",
    "nvidia-nvshmem-cu12",
    "nvidia-nvshmem-cu13",
    "nvidia-nvtx-cu12",
    "opencv-python",
    "polars",
    "polars-runtime-32",
    "triton",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
